<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#805ad5"/>
    </marker>
  </defs>

  <rect width="1160" height="560" fill="#ffffff"/>
  <text x="580" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a202c">Task vs Actor：无状态 vs 有状态</text>

  <!-- ===================== 左栏 Task ===================== -->
  <rect x="40" y="80" width="520" height="440" rx="14" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="300" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6cb0">Task（无状态函数）</text>

  <!-- 函数 -->
  <rect x="250" y="150" width="100" height="56" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="300" y="184" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6cb0">f(x)</text>

  <!-- 三个 worker -->
  <rect x="70" y="280" width="130" height="80" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="135" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">Worker A</text>
  <text x="135" y="334" text-anchor="middle" font-size="11" fill="#718096">Node 1</text>

  <rect x="235" y="280" width="130" height="80" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="300" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">Worker B</text>
  <text x="300" y="334" text-anchor="middle" font-size="11" fill="#718096">Node 2</text>

  <rect x="400" y="280" width="130" height="80" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="465" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">Worker C</text>
  <text x="465" y="334" text-anchor="middle" font-size="11" fill="#718096">Node 3</text>

  <!-- 调度虚线 -->
  <line x1="300" y1="206" x2="135" y2="280" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrBlue)"/>
  <line x1="300" y1="206" x2="300" y2="280" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrBlue)"/>
  <line x1="300" y1="206" x2="465" y2="280" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrBlue)"/>
  <text x="320" y="250" font-size="12" fill="#2b6cb0">可调度到任意空闲节点</text>

  <!-- 输出 -->
  <line x1="300" y1="360" x2="300" y2="400" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">输入 → 输出（ObjectRef）</text>

  <text x="300" y="478" text-anchor="middle" font-size="13" fill="#4a5568">任务间不共享内存，调用无顺序保证</text>
  <text x="300" y="500" text-anchor="middle" font-size="12" fill="#718096">适合：map / 批量推理 / 无状态并行</text>

  <!-- ===================== 右栏 Actor ===================== -->
  <rect x="600" y="80" width="520" height="440" rx="14" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="860" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b46c1">Actor（有状态对象）</text>

  <!-- 常驻进程 -->
  <rect x="730" y="160" width="220" height="150" rx="10" fill="#ffffff" stroke="#805ad5" stroke-width="1.8"/>
  <text x="840" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b46c1">Actor 实例（常驻进程）</text>
  <rect x="760" y="212" width="160" height="52" rx="8" fill="#ede9fe"/>
  <text x="840" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b46c1">state</text>
  <text x="840" y="252" text-anchor="middle" font-size="11" fill="#718096">累积计数 / 模型权重</text>

  <!-- 固定到节点 -->
  <line x1="950" y1="235" x2="1010" y2="235" stroke="#805ad5" stroke-width="2" marker-end="url(#arrPurple)"/>
  <rect x="1015" y="200" width="90" height="70" rx="10" fill="#ffffff" stroke="#805ad5" stroke-width="1.6"/>
  <text x="1060" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b46c1">固定在</text>
  <text x="1060" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b46c1">Node B</text>

  <!-- 串行调用 -->
  <line x1="630" y1="200" x2="730" y2="200" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/>
  <text x="680" y="192" text-anchor="middle" font-size="12" fill="#4a5568">call 1</text>
  <line x1="640" y1="245" x2="730" y2="245" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="685" y="238" text-anchor="middle" font-size="12" fill="#718096">call 2</text>
  <line x1="650" y1="288" x2="730" y2="288" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="690" y="281" text-anchor="middle" font-size="12" fill="#718096">call 3</text>
  <text x="860" y="338" text-anchor="middle" font-size="12" fill="#805ad5">方法串行执行，按提交顺序排队</text>

  <text x="860" y="478" text-anchor="middle" font-size="13" fill="#4a5568">状态钉在节点上，方法调用有顺序保证</text>
  <text x="860" y="500" text-anchor="middle" font-size="12" fill="#718096">适合：参数服务器 / 推理服务 / 状态机</text>
</svg>
